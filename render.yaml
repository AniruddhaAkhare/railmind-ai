services:
  - type: web
    name: railmind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ENABLE_SYNTHETIC_DATA
        value: "True"
      - key: ENABLE_SIMULATION
        value: "True"
      - key: ENABLE_AGENTS
        value: "True"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-2-7b-chat
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: railmind-db
          property: connectionString

databases:
  - name: railmind-db
    databaseName: railmind_ai
    user: railmind
    plan: free
